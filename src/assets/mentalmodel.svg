<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <style>
      .bg{fill:url(#g)}
      .title{font:700 48px/1.1 'Inter',sans-serif; fill:#0f172a}
      .pill{font:600 18px/1 'Inter',sans-serif; fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <g transform="translate(80,80)">
    <text class="title">5-Layer Mental Model</text>
    <g transform="translate(0,80)">
      <rect x="0" y="0" width="1040" height="420" rx="16" fill="#ffffff" opacity="0.06"/>
      <g transform="translate(20,20)">
        <g transform="translate(0,0)">
          <rect x="0" y="0" width="1000" height="64" rx="12" fill="#111827" opacity="0.92"/>
          <text x="20" y="40" class="pill">1. Representation</text>
        </g>
        <g transform="translate(0,80)">
          <rect x="0" y="0" width="1000" height="64" rx="12" fill="#0ea5e9" opacity="0.95"/>
          <text x="20" y="40" class="pill">2. Architecture</text>
        </g>
        <g transform="translate(0,160)">
          <rect x="0" y="0" width="1000" height="64" rx="12" fill="#7c3aed" opacity="0.95"/>
          <text x="20" y="40" class="pill">3. Generation Paradigm</text>
        </g>
        <g transform="translate(0,240)">
          <rect x="0" y="0" width="1000" height="64" rx="12" fill="#ef4444" opacity="0.95"/>
          <text x="20" y="40" class="pill">4. Training Objective</text>
        </g>
        <g transform="translate(0,320)">
          <rect x="0" y="0" width="1000" height="64" rx="12" fill="#10b981" opacity="0.95"/>
          <text x="20" y="40" class="pill">5. Conditioning</text>
        </g>
      </g>
    </g>
  </g>
</svg>
